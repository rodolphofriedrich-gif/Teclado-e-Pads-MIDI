name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install & Build
      run: |
        npm install
        npm run build
        npx cap sync android

    - name: Build APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Renomear APK
      run: |
        mkdir -p dist
        cp android/app/build/outputs/apk/debug/app-debug.apk dist/RT-Music.apk

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: RT-Music-APK
        path: dist/RT-Music.apk
        retention-days: 15
