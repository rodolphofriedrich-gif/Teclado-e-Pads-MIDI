name: Build APK — Teclado e Pads MIDI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Isso adiciona um botão para você rodar manualmente se quiser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Instalar Dependências Web e Capacitor
      run: |
        npm install
        npm run build
        npx cap sync android

    - name: Configurar o Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Compilar APK de Debug (Android)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # NOVO PASSO: Renomear o APK para ficar bonito ao baixar
    - name: Renomear APK
      run: |
        mkdir -p dist
        cp android/app/build/outputs/apk/debug/app-debug.apk dist/Teclado-e-Pads-MIDI.apk

    - name: Salvar o APK gerado como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: Teclado-e-Pads-MIDI-APK
        path: dist/Teclado-e-Pads-MIDI.apk # Agora o path aponta para o arquivo renomeado
        retention-days: 15 # Opcional: mantém o arquivo por 15 dias no GitHub
